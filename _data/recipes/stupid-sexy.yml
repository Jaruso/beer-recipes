  - amount: "1.00 oz"
    name: "X-14"
    timing: "Dry hop at high kräusen on Nov 17, 2026; citrus / herbal (added)"
yeast:
  - amount: "1 sachet (15 g)"
    name: "CellarScience NE HAZY"
    notes: "Pitch into ~67°F wort; target 67–68°F during active fermentation, then rise to 69–71°F as fermentation finishes."
other_ingredients:
  - amount: "0.5 lb"
    name: "Rice hulls (nonfermentable)"
    timing: "Mash / lautering aid"
  - amount: "6.0 g total"
    name: "Calcium chloride dihydrate (CaCl₂·2H₂O)"
    timing: "3.3 g mash / 2.7 g sparge; based on 10 gal water"
  - amount: "4.0 g total"
    name: "Gypsum dihydrate (CaSO₄·2H₂O)"
    timing: "2.2 g mash / 1.8 g sparge; based on 10 gal water"
  - amount: "~½ tablet"
    name: "Campden"
    timing: "Treat ~10 gal tap water for disinfectant; check actual tablet strength"
  - amount: "As directed (optional)"
    name: "Yeast nutrient"
    timing: "Near flameout"
process:
  - name: "Treat brewing water"
    instructions: "Plan 10 gal total water: 5.5 gal mash and 4.5 gal sparge. Treat with Campden and add 3.3 g calcium chloride dihydrate + 2.2 g gypsum to mash water, 2.7 g calcium chloride dihydrate + 1.8 g gypsum to sparge water. Water adjustments are based on a Pennichuck 2025 representative sample, not a measured current tap profile."
  - name: "Mash in"
    instructions: "Heat ~5.5 gal strike water to ~166–168°F. Mill the 2-row, Munich and red wheat; add rolled oats and flaked corn directly. Mix in 0.5 lb rice hulls. Mash at 154°F for 60 min and aim for pH 5.2–5.4, checking a cooled sample after 10–15 min."
  - name: "Optional mash out and sparge"
    instructions: "Mash out at 168°F for 10 min if practical. Sparge at 168–170°F to collect roughly 7.5–8 gal pre-boil wort, adjusting to actual system absorption, boil-off, and trub losses."
  - name: "Boil and bitter"
    instructions: "Boil for 60 minutes. With 50–55 min remaining, add 0.65 oz HBC 586 Krush. The precise IBU contribution depends on alpha-acid percentages and utilization; yeast nutrient may be added near flameout."
  - name: "Whirlpool"
    instructions: "At flameout cool wort to ~170°F. Add 1.0 oz X-14, 1.5 oz Elani and 1.5 oz Citra. Hold around 165–170°F for 20 min."
  - name: "Chill and pitch"
    instructions: "Rapidly chill to ~67°F. Sanitize equipment, transfer toward 6 gal into fermenter (observed ~5.5 gal), confirm cooled original gravity, oxygenate, and pitch one 15 g sachet CellarScience NE HAZY."
  - name: "Active fermentation"
    instructions: "Target ~67–68°F at first, rising toward 69–71°F near completion. Actual 2026 batch fermented in a pressure-rated vessel with a spunding valve set around 5–7 PSI; Tilt logged 63–70°F over Nov 15–19. Confirm stable gravity before packaging."
  - name: "Dry hop"
    instructions: "ACTUAL: Added all 6 oz on Nov 17 during high kräusen for possible biotransformation: 2 oz Citra, 2 oz Elani, 1 oz Krush and 1 oz X-14, using a CO₂-purged AromAnator to limit oxygen exposure. Target approximately 48–72 h warm contact. Check for hop creep, stable gravity and no diacetyl before cold crash or packaging."
  - name: "Secondary transfer (planned)"
    instructions: "Brewer planned to rack to secondary on Nov 20, 2026 to limit extended warm contact with 6 oz dry hops. Status: planned, not confirmed completed. Use a sanitized, CO₂-purged receiving vessel and closed pressure-rated transfer, avoiding oxygen; verify gravity has stabilized and check diacetyl before final packaging."
  - name: "Cold crash and keg"
    instructions: "After stable FG and no diacetyl, optionally cold crash to 35–38°F without air suck-back. Sanitize and thoroughly CO₂-purge a Corny keg; closed-transfer the available beer (kegged volume not yet known), leaving behind yeast and hop sediment. Carbonate to 2.4–2.5 volumes CO₂ (~11–12 psi at 38°F as a starting point)."
