# Stupid Sexy — 2026 revival, sourced from the brewer's Google Doc.
# Reconstruction of a 2020 concept: not an authenticated original 2020 recipe.
# Targets and actual Tilt readings are explicitly distinguished below.
featured: true
name: "Stupid Sexy"
style: "Specialty IPA: New England IPA"
summary: "A juicy, tropical, low-bitterness NEIPA with silky orange-juice-like mouthfeel, mango, pineapple, peach and bright citrus. A 2026 reconstruction of the 2020 Stupid Sexy concept, not the recovered original recipe."
