notes:
  - "The original November 30, 2020 Stupid Sexy post described Golden Promise, light Munich, dark wheat, flaked corn and flaked oats, plus Hüll Melon, El Dorado, Motueka and Citra. This document reconstructs the beer with substituted ingredients; 2026 weights and schedules are not the recovered original."
  - "The planned hop total is 10.65 oz: 0.65 oz bittering, 4 oz whirlpool and 6 oz dry hop. HBC 586 Krush was substituted for bittering; X-14 retained for flavor and dry hop. Azacca was reserved and not used."
  - "First recorded Tilt gravity of 1.063 is only a provisional proxy for original gravity; it is not a verified cooled-wort OG. Latest snapshot was 1.058 SG at 64°F on November 15, 2026 at approximately 4:54 p.m. Eastern; fermentation is still underway. The ABV reading at that time (~0.66%) is preliminary, not the finished ABV."
  - "Actual pre-boil gravity reading was 1.042 at 155°F; a hot hydrometer correction is unreliable. Use a cooled gravity sample to confirm before adjusting wort."
  - "Water additions assume calcium chloride dihydrate and gypsum dihydrate. If using anhydrous calcium chloride, recalculate dosage. Chloride-to-sulfate ratio is approximately 2.1:1; mash pH and tap-water composition require measurement."
