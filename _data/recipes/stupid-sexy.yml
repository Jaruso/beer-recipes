notes:
  - "The original November 30, 2020 Stupid Sexy post described Golden Promise, light Munich, dark wheat, flaked corn and flaked oats, plus Hüll Melon, El Dorado, Motueka and Citra. This document reconstructs the beer with substituted ingredients; 2026 weights and schedules are not the recovered original."
  - "The planned hop total is 10.65 oz: 0.65 oz bittering, 4 oz whirlpool and 6 oz dry hop. HBC 586 Krush was substituted for bittering; X-14 retained for flavor and dry hop. Azacca was reserved and not used."
  - "First Tilt gravity 1.063 is an unconfirmed OG proxy. Latest logged Tilt snapshot: 1.012 SG at 65°F, Nov 19, 2026 at 3:31 p.m. Eastern. Estimated apparent attenuation is 80.95% and ABV 6.69%; not yet a verified terminal gravity or finished ABV."
  - "Actual pre-boil gravity reading was 1.042 at 155°F; a hot hydrometer correction is unreliable. Use a cooled gravity sample to confirm before adjusting wort."
  - "Water additions are the planned recipe amounts, not independently confirmed brew-day actuals. They assume calcium chloride dihydrate and gypsum dihydrate; anhydrous calcium chloride requires recalculation. Chloride-to-sulfate ratio estimated ~2.1:1; mash pH and actual tap-water composition require measurement."
  - "November 17: six ounces of hops dropped during active high-krausen fermentation using the CO₂-purged AromAnator. The brewer uses ~5–7 PSI pressure to limit oxygen and retain aroma; the Tilt may fluctuate by several gravity points during pressurized and heavily hopped fermentation."
  - "November 20: closed transfer to secondary is planned (not yet confirmed performed). Aim to minimize oxygen exposure and extended warm contact with hops, without rushing diacetyl cleanup or declaring terminal gravity before stable readings. The 2026 batch used a BIAB mash with reported 155–160°F temperature fluctuations."
  - "Tilt fermentation source: https://docs.google.com/spreadsheets/d/1PmnKwrHjEQDcBubt9rhQ3T0FPwvwCYElsUrhuZ_lFZs/edit (snapshot through Nov 19, 2026). The archive does not update automatically."
